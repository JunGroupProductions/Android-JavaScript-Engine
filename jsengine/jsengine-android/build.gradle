apply plugin: 'com.android.library'
apply plugin: 'com.vanniktech.maven.publish'

apply from: "${rootDir}/utils.gradle"

def libraryVersion = getLibraryVersion()
def releaseType = getReleaseType()

android {
  compileSdkVersion 35

  namespace "com.hyprmx.android.jsengine"
  ndkVersion "28.2.13676358"

  sourceSets {
    main.java.srcDirs += "../jsengine-java/src/main/java/"
    androidTest.java.srcDirs += "../jsengine-java/src/test/java/"
  }

  compileOptions {
    sourceCompatibility 1.8
    targetCompatibility 1.8
  }

  flavorDimensions "mode"
  productFlavors {
    dev {
      dimension "mode"
      ndk { abiFilters 'arm64-v8a' }
    }
    full {
      dimension "mode"
    }
  }

  defaultConfig {
    minSdkVersion 21
    targetSdkVersion 35
    versionCode 2
    versionName libraryVersion
    ndk {
      // abiFilters('arm64-v8a', 'x86_64')
    }
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_TOOLCHAIN=clang', '-DANDROID_STL=c++_static'
        cFlags '-std=c99', '-fstrict-aliasing', '-DDUK_USE_DEBUGGER_SUPPORT', '-DDUK_USE_INTERRUPT_COUNTER', '-DDUK_USE_DEBUGGER_INSPECT', '-DDUK_USE_DEBUGGER_THROW_NOTIFY', '-DDUK_USE_DEBUGGER_PAUSE_UNCAUGHT', '-DDUK_USE_DEBUGGER_DUMPHEAP', '-Werror', '-Wno-implicit-function-declaration', '-Wno-implicit-float-conversion', '-Wno-pointer-to-int-cast'
        cppFlags '-std=c++11', '-fstrict-aliasing', '-fexceptions', '-Werror'
      }
    }

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    // ProGuard rules for consumer apps
    consumerProguardFiles 'consumer-proguard-rules.pro'
  }
  packagingOptions {
    jniLibs {
      useLegacyPackaging = true
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      // proguardFiles not needed - library is not minified, only consumer apps are
      externalNativeBuild {
        cmake {
          arguments '-DCMAKE_BUILD_TYPE=MinSizeRel'
          cFlags '-g0', '-Os', '-fomit-frame-pointer', '-DNDEBUG', '-fvisibility=hidden', '-Werror'
          cppFlags '-g0', '-Os', '-fomit-frame-pointer', '-DNDEBUG', '-fvisibility=hidden', '-Werror'
        }
      }
    }
    debug {
      externalNativeBuild {
        cmake {
          cFlags '-g', '-DDEBUG', '-Werror'
          cppFlags '-g', '-DDEBUG', '-Werror'
        }
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/jni/CMakeLists.txt"
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to copy license files into AAR assets
task copyLicenseFiles(type: Copy) {
  from("${rootDir}/LICENSE") {
    rename { "LICENSE" }
  }
  from("${rootDir}/NOTICE") {
    rename { "NOTICE" }
  }
  from("${rootDir}/THIRD_PARTY_LICENSES") {
    rename { "THIRD_PARTY_LICENSES" }
  }
  into "${projectDir}/src/main/assets/licenses"
}

// Ensure license files are copied before building
preBuild.dependsOn copyLicenseFiles

import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import com.vanniktech.maven.publish.SonatypeHost

mavenPublishing {
    coordinates('com.hyprmx.android', 'jsengine', libraryVersion)

    configure(new AndroidSingleVariantLibrary("fullRelease", true, true))

        pom {
          name = 'JSEngine'
          description = 'Java and Android bindings for JavaScript engines (QuickJS/Duktape) with 16KB page size support'
          url = 'https://github.com/JunGroupProductions/Android-JavaScript-Engine'

          licenses {
            license {
              name = 'The Apache License, Version 2.0'
              url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }

          developers {
            developer {
              id = 'hyprmx'
              name = 'HyprMX'
              email = 'dev@hyprmx.com'
            }
        }

        scm {
            url = 'https://github.com/JunGroupProductions/Android-JavaScript-Engine'
            connection = 'scm:git:github.com/JunGroupProductions/Android-JavaScript-Engine.git'
            developerConnection = 'scm:git:ssh://github.com/JunGroupProductions/Android-JavaScript-Engine.git'
        }
    }

    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, false)
    signAllPublications()
}

// Local artifacts repository for bundling
publishing {
    repositories {
        maven {
            name = "artifacts"
            url = uri(layout.buildDirectory.dir("outputs/maven_artifacts"))
        }
    }
}

// Task to bundle Maven artifacts into a ZIP file for manual upload
tasks.register('bundleMavenArtifacts', Zip) {
    group = "publishing"
    description = "Bundles Maven Central artifacts into a ZIP file"

    dependsOn("publishMavenPublicationToArtifactsRepository")

    def publishedArtifacts = layout.buildDirectory.dir("outputs/maven_artifacts")

    from(publishedArtifacts)
    into("jsengine-${libraryVersion}_maven_artifacts")
    archiveFileName = "jsengine-${libraryVersion}_maven_artifacts.zip"
    destinationDirectory = file("${rootDir}/dist")
}

// Print version info task
tasks.register('printVersion') {
    group = "publishing"
    description = "Prints the current library version"

    doLast {
        println "JSEngine Version: ${libraryVersion}"
        println "Release Type: ${releaseType}"
    }
}
